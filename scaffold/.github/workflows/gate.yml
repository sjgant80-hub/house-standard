name: gate
# Built from the house standard: tests (the page build and the ship gate among them), the seal, a mutation witness
# that must be CLEAN on every gated file with the counts committed in data/gates.json, and the estate genome's birth check.
on: [push, pull_request, workflow_dispatch]
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: tests (the page build and the house standard among them)
        run: node --test test/*.test.mjs
      - name: nothing sealed has changed
        run: node scripts/seal.mjs --check
      - name: the committed gate record lists every gated file, each CLEAN
        run: node scripts/gates.mjs --record
      - name: the gated files, for the mutation gate below
        id: list
        run: echo "files=$(node scripts/gates.mjs --list)" >> "$GITHUB_OUTPUT"
  mutation:
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.gate.outputs.files) }}
    name: mutation gate · ${{ matrix.file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: CLEAN, with the counts as committed
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git .witness
          node scripts/gates.mjs --witness .witness/witness.mjs --check --only "${{ matrix.file }}"
  genome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: sjgant80-hub/estate-genome@v1
